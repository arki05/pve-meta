# pve-meta's own pve-ext managed-patch manifest: the one guest-lifecycle
# hook that wires PVE::RS::Meta into stock libpve-guest-common-perl (see
# docs/DESIGN.md section 6 and, for the design this diff implements,
# docs/LIFECYCLE-PATCHES.md).
#
# Installed to /usr/share/pve-ext/patches/pve-meta-lifecycle.toml; the diff
# it references lives alongside it, under a "lifecycle/" subdirectory (both
# here in the source tree and once installed), which is why the `diff`
# value below is "lifecycle/<file>.diff" rather than a bare filename.
#
# The whole lifecycle is one patched file (docs/DESIGN.md section 6 and
# 11): create, destroy, snapshot, rollback and delete-snapshot all funnel
# through methods of PVE::AbstractConfig, so the five hooks hang off that
# one file, and clone/backup are not carried at all -- see
# docs/LIFECYCLE-PATCHES.md for why. This manifest used to cover seven
# files across pve-container, qemu-server and libpve-guest-common-perl.
#
# `id` is this manifest's stable claim identity (see pve-ext/bin/pve-ext-patch's
# header comment): the root Makefile installs this file under
# "<id>.toml", so `pve-ext-patch apply patches/lifecycle.toml` from a
# checkout and `pve-ext-patch apply pve-meta-lifecycle` against the
# installed package claim the same file either way, regardless of the
# two names' different basenames.
id = "pve-meta-lifecycle"

[[file]]
path = "/usr/share/perl5/PVE/AbstractConfig.pm"
package = "libpve-guest-common-perl"
diff = "lifecycle/libpve-guest-common-perl_AbstractConfig.pm.diff"
marker = "use PVE::RS::Meta;"
check = "perl"
