# pve-meta's own pve-ext managed-patch manifest: the guest-lifecycle hooks that
# wire PVE::RS::Meta into stock PVE (see docs/DESIGN.md section 9 and, for the
# design these diffs implement, docs/LIFECYCLE.md).
#
# Installed to /usr/share/pve-ext/patches/pve-meta-lifecycle.toml; the diffs
# it references live alongside it, under a "lifecycle/" subdirectory (both
# here in the source tree and once installed), which is why each `diff` value
# below is "lifecycle/<file>.diff" rather than a bare filename.
#
# Three patched files in three packages:
#
#   * PVE/AbstractConfig.pm (libpve-guest-common-perl): create, destroy,
#     snapshot, rollback and delete-snapshot all funnel through methods of
#     this one class, and so does the config write every restore ends in,
#     where a backup's notes block is read back into the store. Five
#     lifecycle hooks plus the restore side of backup, one file.
#   * PVE/VZDump/QemuServer.pm (qemu-server) and PVE/VZDump/LXC.pm
#     (pve-container): the backup side, one hook each in `assemble`, which
#     appends the guest's document to the archive's copy of its notes.
#
# Clone is not carried; see docs/LIFECYCLE.md and decisions 008 and 019.
#
# `id` is this manifest's stable claim identity (see pve-ext/bin/pve-ext-patch's
# header comment): the root Makefile installs this file under
# "<id>.toml", so `pve-ext-patch apply patches/lifecycle.toml` from a
# checkout and `pve-ext-patch apply pve-meta-lifecycle` against the
# installed package claim the same file either way, regardless of the
# two names' different basenames.
id = "pve-meta-lifecycle"

[[file]]
path = "/usr/share/perl5/PVE/AbstractConfig.pm"
package = "libpve-guest-common-perl"
diff = "lifecycle/libpve-guest-common-perl_AbstractConfig.pm.diff"
marker = "use PVE::RS::Meta;"
check = "perl"

[[file]]
path = "/usr/share/perl5/PVE/VZDump/QemuServer.pm"
package = "qemu-server"
diff = "lifecycle/qemu-server_VZDump-QemuServer.pm.diff"
marker = "use PVE::RS::Meta;"
check = "perl"

[[file]]
path = "/usr/share/perl5/PVE/VZDump/LXC.pm"
package = "pve-container"
diff = "lifecycle/pve-container_VZDump-LXC.pm.diff"
marker = "use PVE::RS::Meta;"
check = "perl"
