name: build

# Every push and pull request builds and tests the three packages on amd64 and
# arm64. A tag `v<version>` additionally publishes the .debs as a GitHub
# Release and asks apt.arki05.com to index them (docs/DISTRIBUTION.md).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on both, in the same Debian the packages target.
          # libpve-meta-rs-perl is a compiled Perl module and cannot be
          # cross-built casually (perlmod compiles against the host perl), so
          # each architecture builds itself. The arm64 hosted runners are free
          # for public repositories only.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # actions/checkout needs git and node; debian:trixie ships without them.
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libperl-dev perl libjson-perl \
            debhelper dh-cargo devscripts fakeroot dpkg-dev lintian \
            npm shellcheck

      # `--profile minimal` is rustc, cargo and rust-std for the host only.
      # `make wasm` needs the wasm32 standard library as well, and building
      # for a target that is not installed is a hard error, not a skip.
      - name: Install rustup toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown
          "$HOME/.cargo/bin/rustup" component add clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      # The gates, before anything is packaged: `debian/rules` skips
      # dh_auto_test (a packaging build has no guaranteed network), so this
      # is where the suites run.
      - name: Rust tests, clippy, rustdoc and the editor smoke suite
        run: make check test

      - name: The perlmod boundary suite
        run: make -C crates/pve-meta-perl check

      - name: Shell and Perl syntax
        run: make check-perl

      - name: Build .deb packages
        run: make deb

      # Both jobs build all three packages; only the compiled one differs by
      # architecture. The two `Architecture: all` packages are taken from the
      # amd64 job alone, so one file name never means two different files.
      - name: Collect
        run: |
          mkdir -p dist
          shopt -s nullglob
          if [ "${{ matrix.arch }}" = amd64 ]; then
            cp -v ../*.deb dist/
          else
            cp -v ../*_arm64.deb dist/
          fi
          ls -l dist/
          [ -n "$(ls dist)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      # The tag names the pve-meta version: `v0.1.0` is debian/changelog's
      # `0.1.0-1`, whose upstream half Cargo.toml has to match too
      # (debian/rules checks that at build time).
      - name: The tag is the package version
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
          want="${GITHUB_REF_NAME#v}"
          have="$(dpkg-parsechangelog -l debian/changelog -S Version)"
          have="${have%-*}"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $have"
            exit 1
          fi

      # Published files are immutable: apt.arki05.com records the hash of
      # every .deb it has ever published and fails its run if one changes.
      # A file name that already exists in an earlier release is therefore
      # never uploaded again -- pve-ext keeps its own version and is rebuilt
      # by every release, but only a new pve-ext version is published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | xargs -r -I{} gh release view {} --json assets -q '.assets[].name' | sort -u)
          upload=()
          for f in dist/*.deb; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$published"; then
              echo "already published, skipping: $name"
            else
              upload+=("$f")
            fi
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if [ ${#upload[@]} -gt 0 ]; then
            # No --clobber: an asset that exists on this tag is left alone.
            gh release upload "$GITHUB_REF_NAME" "${upload[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name'

      # Ask the apt repository to index the release now rather than at its
      # nightly run. Optional: without the token the release still lands.
      - name: Trigger apt repository publish
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "APT_REPO_DISPATCH_TOKEN is not set; the nightly run will pick the release up."
            exit 0
          fi
          # workflow_dispatch rather than repository_dispatch: it needs only
          # the Actions permission on apt.arki05.com, where repository_dispatch
          # would need Contents: write -- push access to that repository.
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/arki05/apt.arki05.com/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"main"}'
          echo "dispatched"
