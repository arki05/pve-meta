name: audit

# RustSec advisories against Cargo.lock: on every change to the dependency
# set, and weekly regardless, since an advisory can appear for a lock file
# that has not moved.

on:
  push:
    paths: ["Cargo.lock", "Cargo.toml", "crates/*/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", "crates/*/Cargo.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
