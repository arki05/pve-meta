# Dependency update pull requests, one place per ecosystem the packages ship
# from: the Rust workspace, the vendored Monaco editor (ui-extjs/package.json),
# and the actions the build workflow runs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui-extjs
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
