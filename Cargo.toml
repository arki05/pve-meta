[workspace]
resolver = "2"
members = [
    "crates/pve-meta-core",
    "crates/pve-meta-perl",
    "crates/pve-meta-publish",
    "crates/pve-meta-wasm",
]
# pve-meta-perl (PVE::RS::Meta perlmod bindings) needs `libperl-dev` headers
# and only builds on the Linux build host; it is a workspace member (so
# `cargo build -p pve-meta-rs` / `cargo test -p pve-meta-rs` work there) but
# left out of `default-members` so a bare `cargo build`/`cargo test` at the
# workspace root (e.g. on macOS) does not try to build it. An explicit
# `cargo build --workspace` still targets every member, pve-meta-rs included.
default-members = [
    "crates/pve-meta-core",
    "crates/pve-meta-publish",
    "crates/pve-meta-wasm",
]

# Keep debug info in release builds, like upstream `pve-rs` does (it sets the
# same thing in `proxmox-perl-rs/pve-rs/.cargo/config.toml`). `libpve_meta_rs.so`
# is loaded into pveproxy/pvedaemon, so when one of them dies the only way to
# read the core dump is to have symbols for our .so -- without this,
# `coredumpctl gdb` shows nothing but `?? ()` for every frame inside it.
# `dh_strip` still strips the shipped .so and moves the symbols into an
# automatic `libpve-meta-rs-perl-dbgsym` package, so this does not bloat the
# installed package; it only makes `target/release/libpve_meta_rs.so` larger.
[profile.release]
debug = true

# The browser build (crates/pve-meta-wasm, `make wasm`). Everything the
# release profile keeps for `coredumpctl` is dead weight in a download:
# no debug info, size over speed, one codegen unit and LTO so the store and
# api modules -- compiled in, never called -- are dropped, and `abort` on
# panic since wasm32-unknown-unknown cannot unwind anyway.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace.package]
version = "0.1.3"
edition = "2021"
# The oldest toolchain the crates claim to build with; rust-toolchain.toml pins
# the one they are built with. Kept equal to that pin's minor.
rust-version = "1.93"
license = "AGPL-3.0-or-later"
authors = ["Julius Arkenberg <julius@rkenberg.de>"]
repository = "https://github.com/arki05/pve-meta"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
hex = "0.4"
regex = "1"
saphyr-parser = "0.0"
libc = "0.2"
