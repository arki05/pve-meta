[workspace]
resolver = "2"
members = [
    "crates/pve-meta-core",
    "crates/pve-meta-perl",
]
# pve-meta-perl (PVE::RS::Meta perlmod bindings) needs `libperl-dev` headers
# and only builds on the Linux build host; it is a workspace member (so
# `cargo build -p pve-meta-rs` / `cargo test -p pve-meta-rs` work there) but
# left out of `default-members` so a bare `cargo build`/`cargo test` at the
# workspace root (e.g. on macOS) does not try to build it. An explicit
# `cargo build --workspace` still targets every member, pve-meta-rs included.
default-members = [
    "crates/pve-meta-core",
]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Julius Arkenberg <julius@rkenberg.de>"]
repository = "https://github.com/arki05/pve-meta"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.25"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = "1"
tracing = "0.1"
saphyr-parser = "0.0"
