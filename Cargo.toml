[workspace]
resolver = "2"
members = [
    "crates/pve-meta-core",
    "crates/pve-meta-api",
    "crates/pve-metad",
    "crates/pve-meta-cli",
]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Julius Arkenberg <julius@rkenberg.de>"]
repository = "https://github.com/arki05/pve-meta"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.25"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = "1"
tracing = "0.1"
saphyr-parser = "0.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
http = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-graceful"] }
openssl = "0.10"
libc = "0.2"
proxmox-api-macro = "1"
proxmox-auth-api = { version = "1", default-features = false, features = ["ticket", "api-types"] }
proxmox-base64 = "1"
proxmox-daemon = "1"
proxmox-http = { version = "1", features = ["body"] }
proxmox-log = "1"
proxmox-rest-server = "1"
proxmox-router = { version = "3", features = ["server", "cli"] }
proxmox-schema = { version = "5", features = ["api-macro"] }
proxmox-systemd = "1"

[patch.crates-io]
pwt = { git = "https://git.proxmox.com/git/ui/proxmox-yew-widget-toolkit.git", rev = "3ce6f16957f26e2bb3c04c79a7d007de6a000020" }
