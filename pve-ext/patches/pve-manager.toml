# pve-ext's own managed-patch manifest: the two hooks into stock
# pve-manager (see pve-ext/README.md, "Managed patches"). Installed as
# /usr/share/pve-ext/patches/pve-manager.toml; diffs live alongside it.

[[file]]
path = "/usr/share/pve-manager/index.html.tpl"
package = "pve-manager"
diff = "pve-manager_index.html.tpl.diff"
marker = '<script type="text/javascript" src="/pve2/js/pve-ext-loader.js"></script>'
check = "template"

[[file]]
path = "/usr/share/perl5/PVE/API2.pm"
package = "pve-manager"
diff = "pve-manager_API2.pm.diff"
marker = "PVE::API2::Ext->register_all();"
check = "perl"
