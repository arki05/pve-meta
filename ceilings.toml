# Tested ceilings for the upstream Proxmox packages our patches touch: the
# two hooks pve-ext ships for pve-manager (pve-ext/patches/pve-manager.toml)
# and pve-meta's one guest-lifecycle diff (patches/lifecycle.toml), which
# touches libpve-guest-common-perl (the whole lifecycle is one file -- see
# docs/DESIGN.md section 9 and docs/LIFECYCLE.md; pve-container and
# qemu-server are no longer patched at all).
#
# Bumped automatically by .github/workflows/watch-pve.yml
# (scripts/watch-pve/check.sh) once a newer upstream release's
# `pve-ext-patch verify` of every registered manifest still applies
# cleanly. See docs/DISTRIBUTION.md ("Ceiling watcher") for the full
# mechanism and the manual escape hatch.
#
# This is a warn-only ceiling, not a dependency pin: apt dist-upgrade is
# never blocked by it (see docs/DISTRIBUTION.md, "Upgrade gating").

[tested]
pve-manager = "9.2.11"
libpve-guest-common-perl = "6.0.5"
