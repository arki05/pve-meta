[build]
release = true
# Served natively by pveproxy at /pve2/js/pve-meta-ui/ (see docs/NATIVE-API-SPEC.md); the
# `ui` Makefile target installs `dist/` to /usr/share/pve-manager/js/pve-meta-ui/.
public_url = "/pve2/js/pve-meta-ui/"

[[hooks]]
stage = "build"
command = "grass"
command_arguments = ["css/desktop-yew-style.scss", "dist/.stage/desktop-yew-style.css"]

[[hooks]]
stage = "build"
command = "grass"
command_arguments = ["css/crisp-yew-style.scss", "dist/.stage/crisp-yew-style.css"]
